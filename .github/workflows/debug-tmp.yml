name: Debug FIBA player page (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > p.mjs <<'JS'
          const urls=['/en/events/eurocup-women-26-27/teams/bcf-elfic-fribourg/365363-x','/en/events/eurocup-women-26-27/teams/bcf-elfic-fribourg/365363-mila-benjak'];
          for (const ua of ['Mozilla/5.0 (EuroCup Women dashboard data refresh)','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36']) for (const u of urls){
            const r=await fetch('https://www.fiba.basketball'+u,{headers:{'user-agent':ua,accept:'text/html'}});const h=await r.text();
            const re=/self\.__next_f\.push\((\[[\s\S]*?\])\)<\/script>/g;let m,s='',n=0;while((m=re.exec(h))){n++;try{const a=JSON.parse(m[1]);if(typeof a[1]==='string')s+=a[1]}catch{}}
            const c=k=>(s.split(k).length-1);
            console.log(JSON.stringify({ua:ua.slice(13,30),u:u.slice(-20),status:r.status,final:r.url.slice(-30),htmlLen:h.length,chunks:n,payLen:s.length,birthDate:c('"birthDate"'),nationalities:c('"nationalities"'),heightCm:c('"heightCm"'),dateOfBirth:c('"dateOfBirth"'),rawBirth:h.split('birthDate').length-1}));
            const i=h.indexOf('birthDate'); if(i>0) console.log('RAW:',h.slice(i-200,i+150));
          }
          JS
          node p.mjs
